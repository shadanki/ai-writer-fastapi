<!--
Place this file at: app/static/index.html
Make sure FastAPI serves /static (in main.py):
    from fastapi.staticfiles import StaticFiles
    app.mount("/static", StaticFiles(directory="app/static"), name="static")
You can open: http://localhost:8000/static/index.html
-->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-Writer MVP</title>
  <!-- Minimal styles (Pico CSS CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
  <style>
    :root { --gap: 1rem; }
    main { max-width: 1100px; margin: auto; }
    .grid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
    @media (min-width: 980px) { .grid { grid-template-columns: 1.1fr 0.9fr; } }
    .card { border: 1px solid var(--muted-border-color); border-radius: .75rem; padding: 1rem; }
    .muted { color: var(--muted-color); }
    .hidden { display: none !important; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .spinner { width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg);} }
    pre { max-height: 320px; overflow: auto; }
    #toast { position: fixed; right: 1rem; bottom: 1rem; z-index: 9999; }
    .badge { padding: .15rem .45rem; border-radius: .5rem; font-size: .8rem; background: var(--muted-border-color); }
    .good { background: #d4f7d5; }
    .warn { background: #fff2cc; }
  </style>
</head>
<body>
  <header class="container">
    <h1>AI-Writer MVP <span class="muted" style="font-size:.6em">（最小UI）</span></h1>
    <small id="sessionIndicator" class="muted">未作成</small>
  </header>
  <main class="container grid">
    <!-- Left: controls -->
    <section class="card">
      <h2>1) 入力</h2>
      <form id="formSession" class="grid" onsubmit="return false;">
        <label>
          トピック（例：営業DX / プロジェクト管理）<input id="topic" name="topic" placeholder="トピック" required />
        </label>
        <label>
          概要（任意）<textarea id="draft" name="draft" rows="4" placeholder="書きたい概要や素案"></textarea>
        </label>
        <div class="row">
          <label>言語
            <select id="language">
              <option value="ja" selected>日本語</option>
              <option value="en">English</option>
            </select>
          </label>
          <button id="btnCreateSession" class="contrast">セッション作成</button>
          <button id="btnReset" class="secondary" type="button">リセット</button>
        </div>
      </form>
      <hr />

      <h2>2) タイトル候補</h2>
      <div class="row">
        <button id="btnGenTitles" disabled>タイトルを生成</button>
        <small class="muted">5件以上の候補が表示されます</small>
      </div>
      <div id="titleList" class="grid" style="grid-template-columns: 1fr 1fr; gap: .75rem; margin-top:.5rem"></div>

      <hr />
      <h2>3) アウトライン & 本文</h2>
      <div class="row">
        <button id="btnOutline" disabled>アウトライン生成</button>
        <button id="btnArticle" disabled class="contrast">本文生成</button>
        <span id="busy" class="hidden"><span class="spinner"></span> 実行中…</span>
      </div>
      <details style="margin-top:.5rem">
        <summary>アウトライン（JSON）</summary>
        <pre id="outlineJson" class="card"></pre>
      </details>
    </section>

    <!-- Right: preview -->
    <section class="card">
      <h2>4) プレビュー</h2>
      <div class="row" style="justify-content: space-between;">
        <small id="selectedTitle" class="muted">（タイトル未選択）</small>
        <div class="row">
          <button id="btnCopyMd" class="secondary" disabled>.mdをコピー</button>
          <a id="btnOpenDocs" href="/docs" target="_blank" class="secondary">APIドキュメント</a>
        </div>
      </div>
      <article id="preview" style="margin-top:.5rem"></article>
      <details style="margin-top:1rem">
        <summary>Markdown（生）</summary>
        <pre id="mdRaw" class="card"></pre>
      </details>
    </section>
  </main>

  <div id="toast" class="hidden">
    <small id="toastMsg" class="badge warn"></small>
  </div>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  // ---- tiny helpers ----
  const $ = (id) => document.getElementById(id);
  const state = {
    sessionId: null,
    selectedCandidateId: null,
    outline: null,
    markdown: '',
  };
  function toast(msg) { const t=$('toast'); $('toastMsg').textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'), 3000); }
  function setBusy(b) { $('busy').classList.toggle('hidden', !b); }
  function setDisabled(el, b){ el.disabled = !!b; }
  function saveSessionId(id){ state.sessionId = id; localStorage.setItem('sessionId', id); $('sessionIndicator').textContent = `session: ${id}`; }
  function loadSessionId(){ const id = localStorage.getItem('sessionId'); if(id){ state.sessionId=id; $('sessionIndicator').textContent = `session: ${id}`; $('btnGenTitles').disabled=false; } }
  function clearUI(){ $('titleList').innerHTML=''; $('outlineJson').textContent=''; $('preview').innerHTML=''; $('mdRaw').textContent=''; $('selectedTitle').textContent='（タイトル未選択）'; $('btnCopyMd').disabled=true; }

  async function post(path, body){
    const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(!res.ok){ throw new Error(`${res.status} ${res.statusText}`); }
    return res.json();
  }

  // ---- step 1 ----
  $('btnCreateSession').addEventListener('click', async () => {
    try {
      setDisabled($('btnCreateSession'), true);
      const topic = $('topic').value.trim();
      if(!topic){ toast('トピックを入力してください'); return; }
      const draft = $('draft').value.trim();
      const language = $('language').value || 'ja';
      const data = await post('/api/session', { topic, draft: draft || null, language });
      if(data.sessionId){ saveSessionId(data.sessionId); $('btnGenTitles').disabled = false; toast('セッションを作成しました'); }
      clearUI();
    } catch(e){ console.error(e); toast('セッション作成に失敗しました'); }
    finally { setDisabled($('btnCreateSession'), false); }
  });

  $('btnReset').addEventListener('click', () => {
    localStorage.removeItem('sessionId'); state.sessionId=null; clearUI(); $('sessionIndicator').textContent='未作成'; $('btnGenTitles').disabled=true; });

  // ---- step 2 ----
  $('btnGenTitles').addEventListener('click', async () => {
    if(!state.sessionId){ toast('セッションがありません'); return; }
    try{
      setBusy(true); $('titleList').innerHTML='';
      const data = await post('/api/titles', { sessionId: state.sessionId, maxCandidates: 10 });
      const candidates = data.candidates || data || [];
      if(!Array.isArray(candidates) || candidates.length === 0){ toast('候補が取得できませんでした'); return; }
      const frag = document.createDocumentFragment();
      candidates.slice(0,10).forEach(c => {
        const card = document.createElement('div'); card.className='card';
        const score = typeof c.score === 'number' ? c.score : 0;
        card.innerHTML = `
          <strong>${c.title || '(no title)'}</strong><br/>
          <span class="badge ${score>=0.7?'good': score>=0.4?'':'warn'}">score: ${score.toFixed(2)}</span>
          <div class="row" style="margin-top:.5rem">
            <button class="contrast" data-id="${c.id}">採用</button>
          </div>`;
        card.querySelector('button').addEventListener('click', () => selectTitle(c.id, c.title));
        frag.appendChild(card);
      });
      $('titleList').appendChild(frag);
    } catch(e){ console.error(e); toast('タイトル生成に失敗しました'); }
    finally { setBusy(false); }
  });

  async function selectTitle(candidateId, title){
    if(!state.sessionId) return;
    try {
      setBusy(true);
      await post('/api/select-title', { sessionId: state.sessionId, candidateId });
      state.selectedCandidateId = candidateId;
      $('selectedTitle').textContent = `選択中のタイトル：${title}`;
      $('btnOutline').disabled = false;
      toast('タイトルを採用しました');
    } catch(e){ console.error(e); toast('タイトル採用に失敗しました'); }
    finally { setBusy(false); }
  }

  // ---- step 3 ----
  $('btnOutline').addEventListener('click', async () => {
    if(!state.sessionId) return toast('セッションがありません');
    try{
      setBusy(true);
      const data = await post('/api/generate-outline', { sessionId: state.sessionId });
      state.outline = data.outline || data;
      $('outlineJson').textContent = JSON.stringify(state.outline, null, 2);
      $('btnArticle').disabled = false;
    } catch(e){ console.error(e); toast('アウトライン生成に失敗しました'); }
    finally { setBusy(false); }
  });

  $('btnArticle').addEventListener('click', async () => {
    if(!state.sessionId) return toast('セッションがありません');
    try{
      setBusy(true);
      const data = await post('/api/generate-article', { sessionId: state.sessionId });
      state.markdown = data.markdown || '';
      // preview
      $('mdRaw').textContent = state.markdown;
      const html = window.marked.parse(state.markdown || '');
      $('preview').innerHTML = html;
      $('btnCopyMd').disabled = !state.markdown;
    } catch(e){ console.error(e); toast('本文生成に失敗しました'); }
    finally { setBusy(false); }
  });

  // ---- preview helpers ----
  $('btnCopyMd').addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(state.markdown || ''); toast('.md をコピーしました'); }
    catch{ toast('コピーに失敗しました'); }
  });

  // init
  loadSessionId();
  </script>
</body>
</html>
